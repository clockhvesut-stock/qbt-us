# 毎日のデータ収集。米国市場の大引け後に走る。
#
# 時刻について:
#   米国市場の大引けは 16:00 ET。夏時間なら 20:00 UTC、冬時間なら 21:00 UTC。
#   両方に対応するため 22:00 UTC に固定してある（日本時間 翌07:00）。

name: データ収集

on:
  schedule:
    - cron: "0 22 * * 1-5"      # 平日 22:00 UTC = 日本時間 翌朝07:00
  workflow_dispatch:
    inputs:
      max_symbols:
        description: "処理する銘柄数の上限（デバッグ用。空なら全銘柄）"
        required: false
        default: ""

permissions:
  contents: write

concurrency:
  group: collect
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: 依存をインストール
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: ユニバースが無ければ作る
        run: |
          if [ ! -f data/universe.json ]; then
            echo "ユニバース未作成。S&P500とETFで初期化します"
            python build_universe.py --quick
          fi

      - name: データ収集を実行
        env:
          ALPACA_API_KEY: ${{ secrets.ALPACA_API_KEY }}
          ALPACA_SECRET_KEY: ${{ secrets.ALPACA_SECRET_KEY }}
          SEC_USER_AGENT: ${{ secrets.SEC_USER_AGENT }}
        run: |
          ARGS=""
          if [ -n "${{ github.event.inputs.max_symbols }}" ]; then
            ARGS="--max-symbols ${{ github.event.inputs.max_symbols }}"
          fi
          python daily.py $ARGS

      # 失敗した日も必ずコミットする。
      #
      # ここを if: always() にしていないと、収集が落ちた日はリポジトリに
      # 何の変化も起きない。翌朝それを読む側からは「昨日と同じ」と
      # 「昨日は落ちた」の区別がつかず、古い数字で判断してしまう。
      # state/last_run.json に結果が入るので、失敗も記録として残る。
      - name: 結果をコミット
        if: always()
        run: |
          git config user.name  "qbt-bot"
          git config user.email "qbt-bot@users.noreply.github.com"
          git add reports/ data/ state/ dashboard.html || true
          if git diff --cached --quiet; then
            echo "変更なし"
          else
            git commit -m "データ収集 $(date -u +%Y-%m-%d)"
            git pull --rebase --autostash origin ${{ github.ref_name }} || true
            git push
          fi
