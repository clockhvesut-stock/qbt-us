name: バックテスト

on:
  workflow_dispatch:
    inputs:
      universe_limit:
        description: "銘柄数の上限（空なら全銘柄）"
        required: false
        default: "150"
      max_combos:
        description: "パラメータの組み合わせ数の上限（空なら全部＝360通り）"
        required: false
        default: "24"
      skip_walk_forward:
        description: "ウォークフォワード検証を飛ばす"
        type: boolean
        default: true
      start:
        description: "開始日（空なら config の 2015-01-01）"
        required: false
        default: ""

permissions:
  contents: write

concurrency:
  group: backtest
  cancel-in-progress: false

jobs:
  backtest:
    runs-on: ubuntu-latest
    timeout-minutes: 350

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: 依存をインストール
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: 価格データのキャッシュ
        uses: actions/cache@v4
        with:
          path: data_cache
          key: qbt-prices-${{ github.event.inputs.start || '2015-01-01' }}-${{ github.event.inputs.universe_limit || 'all' }}-v1
          restore-keys: |
            qbt-prices-

      - name: ユニバースが無ければ作る
        run: |
          if [ ! -f data/universe.json ]; then
            python build_universe.py --quick
          fi

      - name: バックテストを実行
        run: |
          ARGS=""
          [ -n "${{ github.event.inputs.universe_limit }}" ] && ARGS="$ARGS --universe-limit ${{ github.event.inputs.universe_limit }}"
          [ -n "${{ github.event.inputs.max_combos }}" ]     && ARGS="$ARGS --max-combos ${{ github.event.inputs.max_combos }}"
          [ -n "${{ github.event.inputs.start }}" ]          && ARGS="$ARGS --start ${{ github.event.inputs.start }}"
          [ "${{ github.event.inputs.skip_walk_forward }}" = "true" ] && ARGS="$ARGS --skip-walk-forward"
          echo "オプション: $ARGS"
          python backtest.py \
            --out reports/backtest.html \
            --json-out reports/backtest_summary.json \
            $ARGS

      - name: 結果をコミット
        if: always()
        run: |
          git config user.name  "qbt-bot"
          git config user.email "qbt-bot@users.noreply.github.com"
          git add reports/backtest.html reports/backtest_summary.json reports/*_trades.csv data/ || true
          if git diff --cached --quiet; then
            echo "変更なし"
          else
            git commit -m "バックテスト $(date -u +%Y-%m-%d_%H%M)"
            git pull --rebase --autostash origin ${{ github.ref_name }} || true
            git push
          fi
